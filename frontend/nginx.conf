server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Resolver interno do Docker para re-resolver IPs de containers automaticamente
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA: todas as rotas desconhecidas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desabilita cache para index.html para evitar que o navegador sirva bundles antigos apos deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Proxy para o backend FastAPI — remove o prefixo /api
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
