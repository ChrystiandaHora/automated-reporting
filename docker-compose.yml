services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3080:6379"
    volumes:
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro

  backend:
    build: ./backend
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: sqlite:////data/nexus.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - munka_data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  celery_worker_analises:
    build: ./backend
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: sqlite:////data/nexus.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      CELERY_QUEUE: analises
    volumes:
      - munka_data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    command: celery -A celery_app worker --loglevel=info -Q analises -c 3
    restart: unless-stopped

  celery_worker_envios:
    build: ./backend
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: sqlite:////data/nexus.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
      CELERY_QUEUE: envios
    volumes:
      - munka_data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    command: celery -A celery_app worker --loglevel=info -Q envios -c 4
    restart: unless-stopped

  celery_flower:
    build: ./backend
    command: celery -A celery_app flower --port=5555
    ports:
      - "3090:5555"
    environment:
      TZ: America/Sao_Paulo
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONPATH: /app
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  munka_data:
  redis_data:
